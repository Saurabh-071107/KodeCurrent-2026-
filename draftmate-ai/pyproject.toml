[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draftmate-ai"
version = "1.0.0"
description = "AI-powered legal document drafting service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx==0.28.0",
    "tenacity==8.5.0",
    "google-generativeai==0.8.3",
    "openai==1.55.0",
    "anthropic==0.45.0",
    "pypdf==5.0.1",
    "python-docx==1.1.0",
    "aiosqlite==0.20.0",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.4.1",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "chardet==5.2.0",
    "libreoffice-convert==0.1.0",
    "openai-whisper==20231117",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.0",
    "black",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true